<!DOCTYPE html>
<html>
<head>
<title>Login</title>
<link rel="stylesheet" href="style.css?v=5">
</head>
<body class="authPage">
<div class="authShell">
    <section class="card authHero">
        <h1>🔐 Login To HireHub</h1>
        <p>Recruiters can post jobs, job seekers can apply, and both can track notifications and applications.</p>
        <div class="pillRow">
            <span class="pill">🔒 Secure JWT</span>
            <span class="pill">💼 Recruiter Mode</span>
            <span class="pill">🎯 Jobseeker Mode</span>
        </div>
    </section>

    <section class="card authCard">
        <h2>👋 Welcome Back</h2>
        <p class="subText">Log in using your account.</p>
        <input id="email" placeholder="Email">
        <input id="password" type="password" placeholder="Password">
        <select id="role">
            <option value="jobseeker">Job Seeker</option>
            <option value="recruiter">Recruiter</option>
        </select>
        <button type="button" onclick="login()">🚀 Login</button>
        <p><a href="forgot.html">🔁 Forgot Password?</a></p>

        <p>No account? <a href="register.html">✨ Register</a></p>
    </section>
</div>
<script src="script.js?v=13"></script>
</body>
</html>
