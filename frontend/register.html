<!DOCTYPE html>
<html>
<head>
<title>Register</title>
<link rel="stylesheet" href="style.css?v=23">
</head>
<body class="authPage authMinimalPage">
<section class="card authSoloCard">
    <div class="authLogoBlock">
        <img class="authLogoImage" src="assets/hirehub-logo.svg" alt="Hire Hub logo">
    </div>

    <div class="authSoloHeader">
        <h1>Sign Up</h1>
    </div>

    <div class="formGroup">
        <label class="formLabel" for="name">Full name</label>
        <input id="name" placeholder="Enter your name">
    </div>

    <div class="formGroup">
        <label class="formLabel" for="email">Email</label>
        <input id="email" type="email" placeholder="you@example.com">
    </div>

    <div class="formGroup">
        <label class="formLabel" for="password">Password</label>
        <div class="passwordField">
            <input id="password" type="password" placeholder="Create password">
            <button type="button" class="ghostIconBtn passwordToggle" aria-label="Show password" onclick="togglePassword('password', this)"><span class="eyeIcon"></span></button>
        </div>
        <p id="passwordStrength" class="passwordStrength">Use 8+ chars with uppercase, lowercase, number, and special character.</p>
    </div>

    <div class="formGroup">
        <label class="formLabel" for="role">Role</label>
        <select id="role">
            <option value="jobseeker">Job Seeker</option>
            <option value="recruiter">Recruiter</option>
        </select>
    </div>

    <button type="button" class="fullBtn" onclick="register()">Create Account</button>

    <div class="authMetaLinks">
        <a href="login.html">Log in</a>
    </div>
</section>
<script src="script.js?v=21"></script>
</body>
</html>
