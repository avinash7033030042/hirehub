<!DOCTYPE html>
<html>
<head>
<title>Post Job</title>
<link rel="stylesheet" href="style.css?v=20">
</head>
<body class="portalPage" data-page="postjob" onload="initPostJobPage()">
<div class="portalShell">
    <aside class="portalSidebar">
        <a href="dashboard.html" class="portalBrand">
            <img class="brandLogoMark" src="assets/hirehub-logo.svg" alt="Hire Hub logo">
        </a>

        <div class="portalUser">
            <div id="sidebarUserInitials" class="portalAvatar">HH</div>
            <div>
                <p id="sidebarUserName" class="portalUserName">User</p>
                <p id="sidebarUserRole" class="portalUserRole">Recruiter</p>
            </div>
        </div>

        <nav class="portalNav">
            <a href="dashboard.html" class="portalNavLink" data-nav="overview">Overview</a>
            <a href="jobs.html" class="portalNavLink" data-nav="jobs">Jobs</a>
            <a href="applications.html" class="portalNavLink" data-nav="applications">Applications</a>
            <a href="notifications.html" class="portalNavLink" data-nav="notifications">Notifications</a>
            <a href="profile.html" class="portalNavLink" data-nav="profile">Profile</a>
            <a href="postjob.html" class="portalNavLink recruiterOnly" data-nav="postjob">Post Job</a>
        </nav>

        <button id="logoutBtn" type="button" class="logoutBtn portalLogout">Log out</button>
    </aside>

    <main class="portalMain">
        <header class="portalHeader">
            <div>
                <p class="portalLabel">Recruiter</p>
                <h1>Post Job</h1>
                <p class="subText">Create a dedicated job listing for candidates.</p>
            </div>

            <div class="portalHeaderMeta">
                <span id="portalDate" class="metaPill">Today</span>
                <span id="roleBadge" class="badge">Recruiter</span>
            </div>
        </header>

        <section class="portalCard formPanel">
            <div class="formGridLarge">
                <div class="formGroup">
                    <label class="formLabel" for="jobTitle">Job title</label>
                    <input id="jobTitle" placeholder="Frontend Developer">
                </div>

                <div class="formGroup">
                    <label class="formLabel" for="jobCompany">Company</label>
                    <input id="jobCompany" placeholder="Company name">
                </div>

                <div class="formGroup">
                    <label class="formLabel" for="jobLocation">Location</label>
                    <input id="jobLocation" placeholder="Delhi / Remote">
                </div>

                <div class="formGroup">
                    <label class="formLabel" for="jobSalary">Salary</label>
                    <input id="jobSalary" placeholder="8 LPA">
                </div>
            </div>

            <div class="formGroup">
                <label class="formLabel" for="jobDescription">Description</label>
                <textarea id="jobDescription" rows="8" placeholder="Add job details"></textarea>
            </div>

            <div class="actions">
                <button id="postJobBtn" type="button">Publish Job</button>
                <a href="jobs.html" class="heroActionBtn ghostActionBtn">Back to Jobs</a>
            </div>
        </section>
    </main>
</div>
<script src="script.js?v=21"></script>
</body>
</html>
